titulo = "Viga continua de tres tramos con extremo empotrado y cargas mixtas"
fuente = "Hibbeler, Structural Analysis, 10.ª ed., cap. 11 (pendiente-deflexión en vigas)"
descripcion = "Tramos de 6, 8 y 5 m; 20 kN/m en AB, 60 kN a 3 m de B, 15 kN/m en CD. Incógnitas θB, θC, θD."
unidades = "kN, m"

[referencia]
libro = "Hibbeler, R. C., Structural Analysis"
edicion = "10.ª"
seccion = "cap. 11, pendiente-deflexión en vigas"
datos = "propios"
derivacion = "derivaciones.py, viga_tres_tramos()"

[parametros]
E = 2.0e8
A = 0.01
I = 3.0e-4

[modelo]
nudos = [[0, 0], [6, 0], [14, 0], [19, 0]]
barras = [
    { i = 0, j = 1, E = "E", A = "A", I = "I" },
    { i = 1, j = 2, E = "E", A = "A", I = "I" },
    { i = 2, j = 3, E = "E", A = "A", I = "I" },
]
apoyos = [
    { nudo = 0, ux = true, uy = true, rz = true },
    { nudo = 1, uy = true },
    { nudo = 2, uy = true },
    { nudo = 3, uy = true },
]

