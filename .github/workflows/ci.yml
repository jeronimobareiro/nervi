name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  bitacora:
    name: Bitácora de aportes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/verificar_bitacora.py "origin/${{ github.base_ref }}"

  dco:
    name: Certificado de origen (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/verificar_dco.py "origin/${{ github.base_ref }}"

  licencias:
    name: Licencias de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  rust:
    name: Rust (fmt, clippy, pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p nervi-core
      - name: Rendimiento (release)
        run: cargo test -p nervi-core --release --test verificacion rendimiento -- --nocapture

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - name: Bibliotecas del sistema para Qt (pruebas de la interfaz sin pantalla)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: .venv/bin/pip install maturin pytest ruff pytest-qt "PySide6-Essentials>=6.6" "tomli>=2; python_version < '3.11'"
      - run: .venv/bin/ruff check python tests examples scripts
      - run: .venv/bin/ruff format --check python tests examples scripts
      - run: .venv/bin/maturin develop --release
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: .venv/bin/python examples/portico_simple.py
