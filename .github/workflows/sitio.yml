name: Sitio web

# Publica la documentación en GitHub Pages: https://jeronimobareiro.github.io/nervi/
# Requiere una sola vez: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "sitio/**"
      - "mkdocs.yml"
      - "*.md"
      - "scripts/preparar_sitio.py"
      - "scripts/construir_sitio.py"
      - ".github/workflows/sitio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    name: Construir sitio
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sitio/requirements.txt
      - run: pip install -r sitio/requirements.txt
      # Construye el sitio en todos los idiomas con --strict: un enlace roto o una página
      # faltante deja el control en rojo.
      - run: python scripts/construir_sitio.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/salida

  publicar:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
