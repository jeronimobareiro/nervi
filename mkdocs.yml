# Sitio web de Nervi: https://jeronimobareiro.github.io/nervi/
# Este es el sitio en español y la base de los demás idiomas: `python scripts/preparar_sitio.py`
# genera build/config/mkdocs-<idioma>.yml, y `python scripts/construir_sitio.py` arma todo en
# build/salida/ (español en la raíz; /en/, /pt/ y /ru/).
site_name: Nervi
site_description: Software libre de análisis y dimensionamiento estructural.
site_url: https://jeronimobareiro.github.io/nervi/
repo_url: https://github.com/jeronimobareiro/nervi
repo_name: jeronimobareiro/nervi
edit_uri: ""
copyright: Nervi · GPL-3.0 o posterior · Jerónimo Bareiro y colaboradores
docs_dir: build/sitio/es
site_dir: build/html/es

theme:
  name: material
  language: es
  logo: marca/nervi-isotipo.svg
  favicon: marca/nervi-favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: material/github

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - estilos/nervi.css
extra_javascript:
  - js/katex.js
  - js/idiomas.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra:
  generator: false
  alternate:
    - name: Español
      link: https://jeronimobareiro.github.io/nervi/
      lang: es
    - name: English
      link: https://jeronimobareiro.github.io/nervi/en/
      lang: en
    - name: Português
      link: https://jeronimobareiro.github.io/nervi/pt/
      lang: pt
    - name: Русский
      link: https://jeronimobareiro.github.io/nervi/ru/
      lang: ru
  social:
    - icon: material/github
      link: https://github.com/jeronimobareiro/nervi

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

nav:
  - Inicio: index.md
  - Por qué Nervi: por-que-nervi.md
  - Descargar: descargar.md
  - Primeros pasos: primeros-pasos.md
  - Documentación técnica:
      - Especificación técnica: tecnica/especificacion.md
      - Convenciones de signos: tecnica/convenciones.md
      - Contrato de datos: tecnica/contrato-datos.md
      - Formato de archivo .nrv: tecnica/formato-nrv.md
  - Hoja de ruta: hoja-de-ruta.md
  - Participar:
      - Resumen: participar/index.md
      - Cómo contribuir: participar/contribuir.md
      - Código de conducta: participar/codigo-de-conducta.md
      - Gobierno del proyecto: participar/gobierno.md
      - Seguridad de los resultados: participar/seguridad.md
      - Autores: participar/autores.md
  - Bitácora: bitacora/index.md
