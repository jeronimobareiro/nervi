[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "apex-bim"
description = "Software libre de análisis y dimensionamiento estructural"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.maturin]
manifest-path = "crates/apex-py/Cargo.toml"
python-source = "python"
module-name = "apex._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E741"]  # l, I: notación estándar en estructuras

[tool.ruff.lint.isort]
known-first-party = ["apex"]
