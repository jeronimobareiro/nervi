[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nervi"
description = "Software libre de análisis y dimensionamiento estructural"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.optional-dependencies]
# Interfaz de escritorio. PySide6 (Qt for Python) es LGPL-3.0, compatible con GPL-3.0.
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8", "ruff>=0.6", "pytest-qt>=4.4", "tomli>=2; python_version < '3.11'"]

[project.gui-scripts]
nervi-gui = "nervi.gui:main"

[tool.maturin]
manifest-path = "crates/nervi-py/Cargo.toml"
python-source = "python"
module-name = "nervi._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E741"]  # l, I: notación estándar en estructuras

[tool.ruff.lint.per-file-ignores]
# La interfaz muestra tipografía española a propósito: − (signo menos), › (separador).
"python/nervi/gui/*" = ["RUF001", "RUF002"]
"python/nervi/gui/estilo.py" = ["E501"]  # hoja de estilos Qt, una regla por línea

[tool.ruff.lint.isort]
known-first-party = ["nervi"]
